<html>
<head>
<style>
* {
    text-align: center;
    font-family: monospace;
}
#text {
    text-shadow: 2px 2px 1px black;
}
#box {
    box-shadow: 9px 9px 5px violet;
}
#indent {
    text-indent: 50%;
}
</style>
</head>
<body>
    <h1 id="text">Text shadow gives shadow to text</h1>
    <h1 id="box">Box shadow can give the box a shadow</h1>
<div>
    <p>This is a example of a indent</p>
    <p id="indent">This is a example of a indent</p>
</div>
</body>
</html>
