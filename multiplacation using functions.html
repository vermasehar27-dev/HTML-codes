<html>

<head>
</head>

<body>
    <button onclick="multiply(4, 10)" style="background-color: cornflowerblue; color: white;">Click here to see what 4 times 10 is!</button>
    <p id="result"></p>
    <script>
        function multiply(a, b) {
            a = 4;
            b = 10;
            var result = a * b;
            document.getElementById("result").innerHTML = "Answer: " + result;          
        }
    </script>
</body>

</html>
