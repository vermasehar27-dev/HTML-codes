<html>
    <head>
        <style>
            img#flowerRight {
                float: right;
            }

            img#flowerLeft {
                float: left;
            }
        </style>
    </head>
    <body>
        <h2>
            Float Right
        </h2>
        <p> In this example, an image of a flower will appear on the right of this text. The text will wrap around the image.</p>
        <p>
            <img id="flowerRight" src="flower.jpg" alt="tree" style="width: 100px; height: 100px;">
            <img id="flowerLeft" src="flower.jpg" alt="tree" style="width: 100px; height: 100px;">
            This is dummy content. 
        </p>
    </body>
</html>
