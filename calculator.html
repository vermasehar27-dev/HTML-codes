<html style="background-color: black; color: white;">
    <body>
        <h1 style="color: white;">Simple Calculator</h1>
        <p id="result1"></p>
        <p id="result2"></p>
        <p id="result3"></p>
        <p id="result4"></p>
        <script>
            var num1 = 4
            var num2 = 2
            document.getElementById("result1").innerHTML = "Addition: " + (num1 + num2)
            document.getElementById("result2").innerHTML = "Subtraction: " + (num1 - num2)
            document.getElementById("result3").innerHTML = "Multiplication: " + (num1 * num2)
            document.getElementById("result4").innerHTML = "Division: " + (num1 / num2)
        </script>
    </body>
</html>
