<html>

<head>
    <title>Grid Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<style type="text/css">
    h1 {
        color: rgb(1, 0, 1);
    }

    #a1,
    #a4 {
        color: white;
        background: rgb(146, 188, 238);
        font-size: 20px;
    }

    #a2,
    #a5 {
        color: white;
        background: rgb(245, 98, 218);
        font-size: 20px;
    }

    #a3,

    #a6 {
        color: white;
        background: rgb(194, 114, 241);
        font-size: 20px;
    }
</style>
<div class="container-fluid">
    <h1>Unequal Area Grids</h1>
    <div class="row">
        <div id="a1" class="col-sm-3">1-3</div>
        <div id="a2" class="col-sm-4">4-7</div>
        <div id="a3" class="col-sm-5">8-12</div>
    </div>

    <div class="row">
        <div id="a4" class="col-sm-2">1-2 </div>
        <div id="a5" class="col-sm-6">3-8 </div>
        <div id="a6" class="col-sm-4">9-12 </div>
    </div>
</div>

</body>

</html>
