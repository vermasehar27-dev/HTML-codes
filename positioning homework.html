<html>
    <head>
        <style>
div {
    right: 50px;
    border: 3px solid palegoldenrod;
}
div.absolute {
    position: absolute;
    left: 50px;
    border: 3px solid palegreen;
}
div.relative {
    position: relative;
    right: 50px;
    border: 3px solid palevioletred;
}
div.fixed {
    position: fixed;
    left: 50px;
    border: 3px solid paleturquoise;
}
div.sticky {
    position: sticky;
    top: 0px;
    right: 50px;
    border: 3px solid papayawhip;
}
        </style>
    </head>
    <body>
        <h2>Positioning</h2>
        <div>
            Div with no position
        </div>
    
        <div class="sticky">
            Div with sticky position
        </div>
    
        <div class="relative">
            This element has relative positioning
        </div>
    
        <div class="absolute">
            Div class: Absolute
        </div>
    
        <div class="fixed">
            This has fixed positioning
        </div>
    </body>
</html>
