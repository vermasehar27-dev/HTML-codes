<html>
    <head>
        <title>
            Forms
        </title>
    </head>
    <body>
        <form>
        <fieldset>
        <legend>Personal Information</legend><br><br>
        <label>Full Name</label><br>
        <input type="text" id="Full Name" placeholder="Enter name here"><br><br>
        <label>Email ID</label><br>
        <input type="text" id="Email ID" placeholder="Enter Email ID here"><br><br>
        <label>Gender</label><br>
        <input type="radio" id="Gender" value="Female">Female
        <input type="radio" id="Gender" value="Male">Male
        <br><br>
        <label>Birthday</label><br>
        <input type="date" id="Birthday" name="Birthday"><br><br>
        <input type="submit">
    </body>
    </fieldset>
    </form>
</html>
