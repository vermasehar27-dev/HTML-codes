<html>

<head>
    <title>Bootstrap Badges</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h2>Badges</h2>
        <span class="badge bg-primary">Blue</span>
        <span class="badge bg-success">Green</span>
        <span class="badge bg-secondary">Grey</span>
        <span class="badge bg-warning">Yellow</span>
        <span class="badge bg-danger">Red</span>
        <span class="badge bg-info">Blue</span>
        <span class="badge bg-light" style="color: black;">White</span>
        <span class="badge bg-dark">Black</span>
    </div>
</body>

</html>
