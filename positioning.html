<html>
    <head>
        <style>
div {
    right: 30px;
    border: 3px solid plum;
}

div.absolute {
    position: absolute;
    left: 50px;
    border: 3px solid powderblue;
}

div.relative {
    position: relative;
    left: 100px;
    border: 3px solid pink;
}

div.fixed {
    position: fixed;
    top: 0;
    right: 20px;
    width: 300px;
    border: 3px solid peachpuff;
}

div.sticky {
    position: sticky;
    top: 1px;
    left: 20px;
    width: 100px;
}
        </style>
    </head>
    <body>
        <h2>Positioning</h2>
<div>
    Div with no position
</div>

<div class="sticky">
    Div with sticky position
</div>

<div class="relative">
    This element has relative positioning
</div>

<div class="absolute">
    Div class: Absolute
</div>

<div class="fixed">
    This has fixed positioning
</div>
    </body>
</html>
